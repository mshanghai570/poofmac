name: Handle Release Packaging

on:
  workflow_run:
    workflows: ["Build DMG Application"] # ⚠️ Change this to match the EXACT name at the top of your DMG build file
    types:
      - completed

permissions:
  contents: write # ⚠️ Crucial: Grants the workflow write access to create the release

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This guarantees the release only runs if the build workflow finished successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Download Intel Zip File
      - name: Download Intel Zip Artifact
        uses: actions/download-artifact@v4
        with:
          name: PoofMac-main-macOS-Intel.zip
          path: ./compressed_assets/intel
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Download Apple Silicon Zip File
      - name: Download Apple Silicon Zip Artifact
        uses: actions/download-artifact@v4
        with:
          name: PoofMac-main-macOS-AppleSilicon.zip
          path: ./compressed_assets/silicon
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Unzip the archives to find the .dmg installers inside
      - name: Unzip Artifacts
        run: |
          mkdir -p ./extracted_dmgs
          # Find and unzip all zipped archives into our target directory
          find ./compressed_assets -name "*.zip" -exec unzip -j {} -d ./extracted_dmgs/ \;
          
          # Debug step: Show the extracted files to make sure DMGs are present
          echo "=== Extracted Files ==="
          ls -la ./extracted_dmgs/

      # 4. Generate the GitHub Release and upload both DMGs at once
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Creates a unique semantic version tag based on the automated run number
          TAG="v1.0.${{ github.event.workflow_run.run_number }}"
          
          echo "Publishing Release $TAG with installers..."
          
          # This command builds the release page and uploads any .dmg in the folder
          gh release create "$TAG" ./extracted_dmgs/*.dmg \
            --title "Release $TAG" \
            --generate-notes
