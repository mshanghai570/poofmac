name: Handle Release Packaging

on:
  workflow_run:
    workflows: ["Build macOS DMG"] # Matches your build file name exactly
    types:
      - completed

permissions:
  contents: write # Grants write access to create the release pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only executes if the build workflow finished successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Download Intel Zip File
      - name: Download Intel Zip Artifact
        uses: actions/download-artifact@v4
        with:
          name: PoofMac-main-macOS-Intel.zip
          path: ./compressed_assets/intel
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Download Apple Silicon Zip File
      - name: Download Apple Silicon Zip Artifact
        uses: actions/download-artifact@v4
        with:
          name: PoofMac-main-macOS-AppleSilicon.zip
          path: ./compressed_assets/silicon
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Extract the archives to retrieve the hidden .dmg installers
      - name: Unzip Artifacts
        run: |
          mkdir -p ./extracted_dmgs
          # Find and unzip all zipped archives cleanly into our target directory
          find ./compressed_assets -name "*.zip" -exec unzip -j {} -d ./extracted_dmgs/ \;
          
          # Debug checklist: Print the extracted assets to ensure files match
          echo "=== Extracted Assets ==="
          ls -la ./extracted_dmgs/

      # 4. Generate the GitHub Release and upload both DMGs simultaneously
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generates a clean version tag based on the automation run number
          TAG="v1.0.${{ github.event.workflow_run.run_number }}"
          
          echo "Publishing Release $TAG with installers..."
          
          # Creates the release web page and attaches all extracted .dmg files
          gh release create "$TAG" ./extracted_dmgs/*.dmg \
            --title "Release $TAG" \
            --generate-notes
