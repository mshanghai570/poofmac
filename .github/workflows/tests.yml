name: Tests

# The safety guardrails, the tool registry and the disk-usage numbers are the
# parts of PoofMac that quietly break user data or lie to the user, so they
# get checked on every push. Runs on Linux: everything under test is pure
# Python (statfs, plistlib, json), and the PySide6 GUI is not exercised here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PoofMac and test dependencies
        run: pip install -e ".[dev]"

      - name: Run the test suite
        run: pytest -q --maxfail=5

  gui:
    name: macOS (full suite + coverage)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PoofMac, test deps and PySide6
        run: pip install -e ".[dev]" "PySide6>=6.6.0,<6.9"

      # The whole suite in one job: everything except the Qt tests also runs
      # on Linux, but only here can gui.py and the macOS-specific paths be
      # measured at all. The Qt widgets are built offscreen, so no display
      # session is needed.
      #
      # --cov-fail-under is a ratchet, not a target: it is set one point below
      # the measured total so a new test can never lower it, and raising it is
      # part of adding coverage.
      - name: Run the full suite with coverage
        run: pytest -q --maxfail=5 --cov=mac_cleaner --cov-report=term-missing:skip-covered --cov-fail-under=46
