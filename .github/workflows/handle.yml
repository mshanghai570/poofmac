name: Handle Release Packaging

# Publishes a GitHub Release with both DMGs after every successful build.
# Previously three near-duplicate workflows (release.yml, manage.yml and this
# file) raced to download an artifact name that never existed
# ("PoofMac-main-macOS-Intel.zip") and failed on every run. This is the one
# survivor, aligned with the artifact names build-dmg.yml actually uploads.

on:
  workflow_run:
    workflows: ["Build macOS DMG"] # Matches build-dmg.yml's name exactly
    types:
      - completed

permissions:
  contents: write # Grants write access to create the release pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only executes if the build workflow finished successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Checkout is needed purely to read the app version out of pyproject.toml
      # so the release tag matches the app (v0.3.0) instead of a run counter.
      - name: Checkout built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Intel DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: PoofMac-${{ github.event.workflow_run.head_branch }}-macOS-Intel
          path: ./extracted_dmgs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Apple Silicon DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: PoofMac-${{ github.event.workflow_run.head_branch }}-macOS-AppleSilicon
          path: ./extracted_dmgs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List extracted assets
        run: ls -la ./extracted_dmgs/

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep gh pointed at this repo even though the checkout is a
          # detached SHA rather than a branch.
          GH_REPO: ${{ github.repository }}
        run: |
          # Tag follows the app version in pyproject.toml, not the run counter:
          # the previous scheme published "v1.0.20" for a 0.3.0 build.
          VERSION=$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml \
            | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
          TAG="v${VERSION}"

          echo "Publishing Release $TAG with installers..."

          # Re-running the workflow for the same version refreshes the existing
          # release rather than failing on "tag already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - replacing its assets"
            gh release upload "$TAG" ./extracted_dmgs/*.dmg --clobber
          else
            gh release create "$TAG" ./extracted_dmgs/*.dmg \
              --title "Release $TAG" \
              --generate-notes
          fi
