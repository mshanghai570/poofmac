[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poofmac"
version = "0.3.1"
description = "PoofMac — local AI-powered Mac disk cleaner. Runs on Ollama, no subscription, no data leaves your machine."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "lesteroliver", email = "hello@poofmac.app" },
]
keywords = ["mac", "disk", "cleaner", "ai", "ollama", "llm", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "litellm>=1.81.14",
    "rich>=13.7.0",
    "textual>=0.60.0",
    "pydantic-settings>=2.2.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://poofmac.app"
Repository = "https://github.com/mshanghai570/poofmac"
"Bug Tracker" = "https://github.com/mshanghai570/poofmac/issues"

[project.scripts]
poofmac = "mac_cleaner.main:run"
mac-cleaner = "mac_cleaner.main:run"

[project.optional-dependencies]
dev = [
    "textual-dev>=0.60.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]
gui = [
    "PySide6>=6.6.0,<6.9",
]

[tool.hatch.build.targets.wheel]
packages = ["mac_cleaner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# ── Briefcase — macOS app bundle + DMG ────────────────────────────────────────
# Build commands:
#   pip install briefcase
#   briefcase build macOS
#   briefcase package macOS --adhoc-sign    # local/CI (no Apple Developer account)
#   briefcase package macOS                 # signed (requires APPLE_* env vars)

[tool.briefcase]
project_name = "PoofMac"
bundle = "app.poofmac"
version = "0.3.1"
url = "https://poofmac.app"
author = "PoofMac Contributors"
author_email = "hello@poofmac.app"

[tool.briefcase.app.mac_cleaner]
formal_name = "PoofMac"
description = "AI-powered Mac disk cleaner with robust safety guardrails"
icon = "assets/icon"
sources = ["mac_cleaner"]
requires = [
    "PySide6-Essentials>=6.6.0,<6.9",
    "litellm>=1.81.14",
    "pydantic-settings>=2.2.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[tool.briefcase.app.mac_cleaner.macOS]
# macOS build settings — note the exact key names Briefcase reads:
# "min_os_version" (not "minimum_os_version") and singular "entitlement.".
# The wrong spellings are silently ignored, producing a bundle with no
# entitlements and a default deployment target.
min_os_version = "12.0"
# Build a single-architecture app for the runner's native arch instead of a
# universal2 app. CI builds each arch on its own runner (macos-latest = arm64,
# macos-15-intel = x86_64). A universal build makes pip resolve the same
# universal2 wheel (e.g. charset_normalizer) into both app_packages.arm64 and
# app_packages.x86_64, and the later lipo merge then fails with "have the same
# architectures (x86_64) and can't be in the same fat output file".
universal_build = false
entitlement."com.apple.security.files.user-selected.read-write" = true
entitlement."com.apple.security.network.client" = true
